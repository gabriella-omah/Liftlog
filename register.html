<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="Create your LiftLog account and start tracking your workouts and progress."
    >

    <title>Create Account • LiftLog</title>

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- Bootstrap Icons -->
    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    >

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Poppins:wght@500;600;700&display=swap"
        rel="stylesheet"
    >

    <!-- Font Awesome -->
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    >

    <!-- Global CSS -->
    <link
        rel="stylesheet"
        href="style/style.css"
    >

    <!-- Auth CSS -->
    <link
        rel="stylesheet"
        href="style/login.css"
    >
</head>

<body>

<main class="auth-page">

    <div id="navbar-placeholder"></div>

    <section class="auth-card">

        <div class="auth-header">
            <h1>Create your account</h1>

            <p>
                Track workouts, build consistency, and stay on top of your progress.
            </p>
        </div>

        <form
            id="registerForm"
            class="auth-form"
            novalidate
        >

            <!-- NAME -->
            <div class="form-group">

                <label for="name">Name</label>

                <div class="input-wrapper">

                    <i
                        class="fa-regular fa-user input-icon"
                        aria-hidden="true"
                    ></i>

                    <input
                        type="text"
                        id="name"
                        name="name"
                        placeholder="Your name"
                        autocomplete="name"
                        minlength="2"
                        required
                    >

                </div>

            </div>

            <!-- EMAIL -->
            <div class="form-group">

                <label for="email">Email</label>

                <div class="input-wrapper">

                    <i
                        class="fa-regular fa-envelope input-icon"
                        aria-hidden="true"
                    ></i>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="you@example.com"
                        autocomplete="email"
                        required
                    >

                </div>

            </div>

            <!-- PASSWORD -->
            <div class="form-group">

                <label for="password">Password</label>

                <div class="input-wrapper password-wrapper">

                    <i
                        class="fa-solid fa-lock input-icon"
                        aria-hidden="true"
                    ></i>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="At least 8 characters"
                        autocomplete="new-password"
                        minlength="8"
                        required
                    >

                    <button
                        type="button"
                        class="password-toggle"
                        aria-label="Show password"
                        aria-pressed="false"
                    >
                        <i
                            class="fa-regular fa-eye"
                            aria-hidden="true"
                        ></i>
                    </button>

                </div>

            </div>

            <!-- SUBMIT -->
            <button
                type="submit"
                id="registerButton"
                class="auth-submit"
            >
                Create Account
            </button>

            <!-- MESSAGE -->
            <p
                id="registerMessage"
                class="auth-message"
                role="alert"
                aria-live="polite"
            ></p>

        </form>

        <div class="auth-links">

            <p>
                Already have an account?
                <a href="login.html">Log in</a>
            </p>

        </div>

    </section>

</main>

<script src="javascript/data.js"></script>

<script>

document.addEventListener("DOMContentLoaded", function () {

    const API_URL = "https://liftlog-otf6.onrender.com";

    const registerForm =
        document.getElementById("registerForm");

    const registerButton =
        document.getElementById("registerButton");

    const registerMessage =
        document.getElementById("registerMessage");

    const nameInput =
        document.getElementById("name");

    const emailInput =
        document.getElementById("email");

    const passwordInput =
        document.getElementById("password");

    const passwordToggle =
        document.querySelector(".password-toggle");


    // =====================================================
    // PASSWORD TOGGLE
    // =====================================================

    if (passwordInput && passwordToggle) {

        passwordToggle.addEventListener("click", function () {

            const showingPassword =
                passwordInput.type === "text";

            passwordInput.type =
                showingPassword
                    ? "password"
                    : "text";

            passwordToggle.setAttribute(
                "aria-label",
                showingPassword
                    ? "Show password"
                    : "Hide password"
            );

            passwordToggle.setAttribute(
                "aria-pressed",
                showingPassword
                    ? "false"
                    : "true"
            );

            const icon =
                passwordToggle.querySelector("i");

            if (icon) {

                icon.classList.toggle(
                    "fa-eye",
                    showingPassword
                );

                icon.classList.toggle(
                    "fa-eye-slash",
                    !showingPassword
                );

            }

        });

    }


    // =====================================================
    // MESSAGE
    // =====================================================

    function showMessage(message, type = "") {

        registerMessage.textContent = message;

        registerMessage.className = "auth-message";

        if (type) {
            registerMessage.classList.add(type);
        }

    }


    // =====================================================
    // LOADING
    // =====================================================

    function setLoadingState(loading) {

        registerButton.disabled = loading;

        registerButton.textContent =
            loading
                ? "Creating account..."
                : "Create Account";

    }


    // =====================================================
    // REGISTER
    // =====================================================

    registerForm.addEventListener(
        "submit",
        async function (event) {

            event.preventDefault();

            const name =
                nameInput.value.trim();

            const email =
                emailInput.value.trim().toLowerCase();

            const password =
                passwordInput.value;


            showMessage("");


            // NAME
            if (!name) {

                showMessage(
                    "Please enter your name.",
                    "error"
                );

                nameInput.focus();

                return;
            }


            if (name.length < 2) {

                showMessage(
                    "Name must be at least 2 characters.",
                    "error"
                );

                nameInput.focus();

                return;
            }


            // EMAIL
            if (!email) {

                showMessage(
                    "Please enter your email.",
                    "error"
                );

                emailInput.focus();

                return;
            }


            if (!emailInput.checkValidity()) {

                showMessage(
                    "Please enter a valid email address.",
                    "error"
                );

                emailInput.focus();

                return;
            }


            // PASSWORD
            if (!password) {

                showMessage(
                    "Please create a password.",
                    "error"
                );

                passwordInput.focus();

                return;
            }


            if (password.length < 8) {

                showMessage(
                    "Password must be at least 8 characters.",
                    "error"
                );

                passwordInput.focus();

                return;
            }


            setLoadingState(true);


            try {

                /*
                 * IMPORTANT:
                 * REGISTER uses /register
                 * NOT /login
                 */

                const response = await fetch(
                    `${API_URL}/api/auth/register`,
                    {
                        method: "POST",

                        headers: {
                            "Content-Type": "application/json"
                        },

                        body: JSON.stringify({
                            name,
                            email,
                            password
                        })
                    }
                );


                const contentType =
                    response.headers.get("content-type") || "";

                let result;


                if (
                    contentType.includes(
                        "application/json"
                    )
                ) {

                    result =
                        await response.json();

                } else {

                    const text =
                        await response.text();

                    result = {
                        success: false,
                        error:
                            text ||
                            "The server returned an invalid response."
                    };

                }


                console.log(
                    "Registration response:",
                    result
                );


                if (
                    !response.ok ||
                    result.success === false
                ) {

                    let message =
                        result.error ||
                        result.message ||
                        "Registration failed. Please try again.";


                    const normalized =
                        String(message).toLowerCase();


                    if (
                        normalized.includes(
                            "already"
                        )
                    ) {

                        message =
                            "An account with this email already exists.";

                    }


                    showMessage(
                        message,
                        "error"
                    );

                    return;
                }


                showMessage(
                    "Account created successfully! Redirecting to login...",
                    "success"
                );


                registerForm.reset();


                setTimeout(function () {

                    window.location.href =
                        "login.html";

                }, 1200);


            } catch (error) {

                console.error(
                    "Registration request error:",
                    error
                );


                showMessage(
                    "Unable to connect to the LiftLog server.",
                    "error"
                );

            } finally {

                setLoadingState(false);

            }

        }
    );

});

</script>

</body>

</html>
