<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="Create your LiftLog account and start tracking your workouts and progress."
    >

    <title>Create Account • LiftLog</title>

    <!-- =====================================================
         BOOTSTRAP
    ====================================================== -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- =====================================================
         BOOTSTRAP ICONS
    ====================================================== -->
    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    >

    <!-- =====================================================
         GOOGLE FONTS
    ====================================================== -->
    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Poppins:wght@500;600;700&display=swap"
        rel="stylesheet"
    >

    <!-- =====================================================
         FONT AWESOME
    ====================================================== -->
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    >

    <!-- =====================================================
         GLOBAL CSS
    ====================================================== -->
    <link
        rel="stylesheet"
        href="style/style.css"
    >

    <!-- =====================================================
         AUTH CSS
    ====================================================== -->
    <link
        rel="stylesheet"
        href="style/login.css"
    >

</head>

<body>

<main class="auth-page">

    <!-- Navbar -->
    <div id="navbar-placeholder"></div>

    <section class="auth-card">

        <!-- =================================================
             HEADER
        ================================================== -->

        <div class="auth-header">

            <h1>Create your account</h1>

            <p>
                Track workouts, build consistency, and stay on top of your progress.
            </p>

        </div>


        <!-- =================================================
             REGISTER FORM
        ================================================== -->

        <form
            id="registerForm"
            class="auth-form"
            novalidate
        >

            <!-- NAME -->

            <div class="form-group">

                <label for="name">
                    Name
                </label>

                <div class="input-wrapper">

                    <i
                        class="fa-regular fa-user input-icon"
                        aria-hidden="true"
                    ></i>

                    <input
                        type="text"
                        id="name"
                        name="name"
                        placeholder="Your name"
                        autocomplete="name"
                        minlength="2"
                        maxlength="100"
                        required
                    >

                </div>

            </div>


            <!-- EMAIL -->

            <div class="form-group">

                <label for="email">
                    Email
                </label>

                <div class="input-wrapper">

                    <i
                        class="fa-regular fa-envelope input-icon"
                        aria-hidden="true"
                    ></i>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="you@example.com"
                        autocomplete="email"
                        required
                    >

                </div>

            </div>


            <!-- PASSWORD -->

            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <div class="input-wrapper password-wrapper">

                    <i
                        class="fa-solid fa-lock input-icon"
                        aria-hidden="true"
                    ></i>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="At least 8 characters"
                        autocomplete="new-password"
                        minlength="8"
                        maxlength="128"
                        required
                    >

                    <button
                        type="button"
                        class="password-toggle"
                        id="passwordToggle"
                        aria-label="Show password"
                        aria-pressed="false"
                    >
                        <i
                            class="fa-regular fa-eye"
                            aria-hidden="true"
                        ></i>
                    </button>

                </div>

            </div>


            <!-- PASSWORD REQUIREMENT -->

            <div class="password-hint">
                Password must contain at least 8 characters.
            </div>


            <!-- SUBMIT -->

            <button
                type="submit"
                id="registerButton"
                class="auth-submit"
            >
                Create Account
            </button>


            <!-- MESSAGE -->

            <p
                id="registerMessage"
                class="auth-message"
                role="alert"
                aria-live="polite"
            ></p>

        </form>


        <!-- =================================================
             LOGIN LINK
        ================================================== -->

        <div class="auth-links">

            <p>
                Already have an account?
                <a href="login.html">
                    Log in
                </a>
            </p>

        </div>

    </section>

</main>


<!-- =========================================================
     DATA SCRIPT
========================================================= -->

<script src="javascript/data.js"></script>


<!-- =========================================================
     REGISTER SCRIPT
========================================================= -->

<script>

document.addEventListener("DOMContentLoaded", function () {

    const registerForm =
        document.getElementById("registerForm");

    const registerButton =
        document.getElementById("registerButton");

    const registerMessage =
        document.getElementById("registerMessage");

    const nameInput =
        document.getElementById("name");

    const emailInput =
        document.getElementById("email");

    const passwordInput =
        document.getElementById("password");

    const passwordToggle =
        document.getElementById("passwordToggle");


    /*
    =========================================================
    BACKEND URL
    =========================================================
    */

    const API_URL =
        "https://liftlog-otf6.onrender.com";


    /*
    =========================================================
    PASSWORD TOGGLE
    =========================================================
    */

    if (passwordToggle && passwordInput) {

        passwordToggle.addEventListener("click", function () {

            const isPassword =
                passwordInput.type === "password";

            passwordInput.type =
                isPassword ? "text" : "password";

            passwordToggle.setAttribute(
                "aria-label",
                isPassword
                    ? "Hide password"
                    : "Show password"
            );

            passwordToggle.setAttribute(
                "aria-pressed",
                isPassword ? "true" : "false"
            );

            const icon =
                passwordToggle.querySelector("i");

            if (icon) {

                icon.classList.toggle(
                    "fa-eye",
                    !isPassword
                );

                icon.classList.toggle(
                    "fa-eye-slash",
                    isPassword
                );

            }

        });

    }


    /*
    =========================================================
    MESSAGE
    =========================================================
    */

    function showMessage(message, type = "") {

        if (!registerMessage) {
            return;
        }

        registerMessage.textContent = message;

        registerMessage.className =
            "auth-message";

        if (type) {
            registerMessage.classList.add(type);
        }

    }


    /*
    =========================================================
    LOADING STATE
    =========================================================
    */

    function setLoadingState(loading) {

        if (!registerButton) {
            return;
        }

        registerButton.disabled = loading;

        registerButton.textContent =
            loading
                ? "Creating account..."
                : "Create Account";

    }


    /*
    =========================================================
    FORM SUBMIT
    =========================================================
    */

    if (!registerForm) {

        console.error(
            "registerForm was not found."
        );

        return;

    }


    registerForm.addEventListener(
        "submit",
        async function (event) {

            event.preventDefault();


            /*
            =================================================
            GET VALUES
            =================================================
            */

            const name =
                nameInput.value.trim();

            const email =
                emailInput.value.trim().toLowerCase();

            const password =
                passwordInput.value;


            showMessage("");


            /*
            =================================================
            VALIDATION
            =================================================
            */

            if (!name) {

                showMessage(
                    "Please enter your name.",
                    "error"
                );

                nameInput.focus();

                return;
            }


            if (name.length < 2) {

                showMessage(
                    "Name must be at least 2 characters.",
                    "error"
                );

                nameInput.focus();

                return;
            }


            if (!email) {

                showMessage(
                    "Please enter your email.",
                    "error"
                );

                emailInput.focus();

                return;
            }


            if (!emailInput.checkValidity()) {

                showMessage(
                    "Please enter a valid email address.",
                    "error"
                );

                emailInput.focus();

                return;
            }


            if (!password) {

                showMessage(
                    "Please create a password.",
                    "error"
                );

                passwordInput.focus();

                return;
            }


            if (password.length < 8) {

                showMessage(
                    "Password must be at least 8 characters.",
                    "error"
                );

                passwordInput.focus();

                return;
            }


            /*
            =================================================
            START LOADING
            =================================================
            */

            setLoadingState(true);


            try {

                /*
                =================================================
                IMPORTANT:
                THIS IS REGISTER, NOT LOGIN
                =================================================
                */

                const response = await fetch(
                    `${API_URL}/api/auth/register`,
                    {
                        method: "POST",

                        headers: {
                            "Content-Type": "application/json"
                        },

                        body: JSON.stringify({
                            name: name,
                            email: email,
                            password: password
                        })
                    }
                );


                /*
                =================================================
                READ RESPONSE
                =================================================
                */

                const contentType =
                    response.headers.get("content-type") || "";

                let result;


                if (
                    contentType.includes(
                        "application/json"
                    )
                ) {

                    result =
                        await response.json();

                } else {

                    const text =
                        await response.text();

                    result = {
                        success: false,
                        error:
                            text ||
                            "The server returned an invalid response."
                    };

                }


                console.log(
                    "Registration response:",
                    result
                );


                /*
                =================================================
                HANDLE ERROR
                =================================================
                */

                if (
                    !response.ok ||
                    result.success === false
                ) {

                    let message =
                        result.error ||
                        result.message ||
                        "Registration failed. Please try again.";


                    const normalized =
                        String(message).toLowerCase();


                    if (
                        normalized.includes(
                            "already registered"
                        ) ||
                        normalized.includes(
                            "already been registered"
                        ) ||
                        normalized.includes(
                            "already exists"
                        )
                    ) {

                        message =
                            "An account with this email already exists.";

                    }


                    if (
                        normalized.includes(
                            "row-level security"
                        )
                    ) {

                        message =
                            "Account creation was blocked by the database security policy. Please check your Supabase users table permissions.";

                    }


                    showMessage(
                        message,
                        "error"
                    );

                    return;

                }


                /*
                =================================================
                SUCCESS
                =================================================
                */

                showMessage(
                    "Account created successfully! Redirecting to login...",
                    "success"
                );


                registerForm.reset();


                /*
                =================================================
                REDIRECT
                =================================================
                */

                setTimeout(function () {

                    window.location.href =
                        "login.html";

                }, 1200);


            } catch (error) {

                console.error(
                    "Registration request error:",
                    error
                );


                showMessage(
                    "Unable to connect to the LiftLog server. Please check your internet connection or try again.",
                    "error"
                );


            } finally {

                setLoadingState(false);

            }

        }
    );

});

</script>

</body>
</html>
