<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="Create your LiftLog account and start tracking your workouts and progress."
    >

    <title>Create Account • LiftLog</title>


    <!-- =====================================================
         BOOTSTRAP
    ====================================================== -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >


    <!-- =====================================================
         BOOTSTRAP ICONS
    ====================================================== -->
    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    >


    <!-- =====================================================
         GOOGLE FONTS
    ====================================================== -->
    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Poppins:wght@500;600;700&display=swap"
        rel="stylesheet"
    >


    <!-- =====================================================
         FONT AWESOME
    ====================================================== -->
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    >


    <!-- =====================================================
         GLOBAL CSS
    ====================================================== -->
    <link
        rel="stylesheet"
        href="style/style.css"
    >


    <!-- =====================================================
         REGISTER PAGE CSS
    ====================================================== -->
    <link
        rel="stylesheet"
        href="style/login.css"
    >

</head>


<body>


<!-- =========================================================
     PAGE
========================================================= -->

<main class="auth-page">

    <div id="navbar-placeholder"></div>

    <section class="auth-card">

        <!-- Header -->
        <div class="auth-header">

            <h1>Create your account</h1>

            <p>
                Track workouts, build consistency, and stay on top of your progress.
            </p>

        </div>

        <!-- Register form -->
        <form id="registerForm" class="auth-form" novalidate>

            <div class="form-group">

                <label for="name">Name</label>

                <div class="input-wrapper">
                    <i class="fa-regular fa-user input-icon" aria-hidden="true"></i>
                    <input
                        type="text"
                        id="name"
                        name="name"
                        placeholder="Your name"
                        autocomplete="name"
                        minlength="2"
                        required
                    >
                </div>

            </div>

            <div class="form-group">

                <label for="email">Email</label>

                <div class="input-wrapper">
                    <i class="fa-regular fa-envelope input-icon" aria-hidden="true"></i>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="you@example.com"
                        autocomplete="email"
                        required
                    >
                </div>

            </div>

            <div class="form-group">

                <label for="password">Password</label>

                <div class="input-wrapper password-wrapper">
                    <i class="fa-solid fa-lock input-icon" aria-hidden="true"></i>
                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="At least 8 characters"
                        autocomplete="new-password"
                        minlength="8"
                        required
                    >
                    <button
                        type="button"
                        class="password-toggle"
                        aria-label="Show password"
                        aria-pressed="false"
                    >
                        <i class="fa-regular fa-eye" aria-hidden="true"></i>
                    </button>
                </div>

            </div>

            <button
                type="submit"
                id="registerButton"
                class="auth-submit"
            >
                Create Account
            </button>

            <p
                id="registerMessage"
                class="auth-message"
                role="alert"
                aria-live="polite"
            ></p>

        </form>

        <!-- Login link -->
        <div class="auth-links">
            <p>
                Already have an account?
                <a href="login.html">Log in</a>
            </p>
        </div>

    </section>

</main>



<!-- =========================================================
     EXISTING DATA SCRIPT
========================================================= -->

<script src="javascript/data.js"></script>



<!-- =========================================================
     REGISTER SCRIPT
========================================================= -->

<script>
document.addEventListener("DOMContentLoaded", function () {
    const registerForm = document.getElementById("registerForm");
    const registerButton = document.getElementById("registerButton");
    const registerMessage = document.getElementById("registerMessage");
    const nameInput = document.getElementById("name");
    const emailInput = document.getElementById("email");
    const passwordInput = document.getElementById("password");
    const passwordToggle = document.querySelector(".password-toggle");

    // ======================================================
    // PASSWORD TOGGLE
    // ======================================================

    if (passwordInput && passwordToggle) {
        passwordToggle.addEventListener("click", function () {
            const showingPassword = passwordInput.type === "text";

            passwordInput.type = showingPassword ? "password" : "text";

            passwordToggle.setAttribute(
                "aria-label",
                showingPassword ? "Show password" : "Hide password"
            );

            passwordToggle.setAttribute(
                "aria-pressed",
                showingPassword ? "false" : "true"
            );

            const icon = passwordToggle.querySelector("i");
            if (icon) {
                icon.classList.toggle("fa-eye", showingPassword);
                icon.classList.toggle("fa-eye-slash", !showingPassword);
            }
        });
    }

    // ======================================================
    // MESSAGE
    // ======================================================

    function showMessage(message, type = "") {
        if (!registerMessage) return;

        registerMessage.textContent = message;
        registerMessage.className = "auth-message";

        if (type) {
            registerMessage.classList.add(type);
        }
    }

    // ======================================================
    // LOADING
    // ======================================================

    function setLoadingState(loading) {
        if (!registerButton) return;

        registerButton.disabled = loading;
        registerButton.textContent = loading
            ? "Creating account..."
            : "Create Account";
    }

    // ======================================================
    // FORM
    // ======================================================

    if (!registerForm) {
        console.error("registerForm was not found.");
        return;
    }

    registerForm.addEventListener("submit", async function (event) {
        event.preventDefault();

        const name = nameInput.value.trim();
        const email = emailInput.value.trim().toLowerCase();
        const password = passwordInput.value;

        showMessage("");

        if (!name) {
            showMessage("Please enter your name.", "error");
            nameInput.focus();
            return;
        }

        if (name.length < 2) {
            showMessage("Name must be at least 2 characters.", "error");
            nameInput.focus();
            return;
        }

        if (!email) {
            showMessage("Please enter your email.", "error");
            emailInput.focus();
            return;
        }

        if (!emailInput.checkValidity()) {
            showMessage("Please enter a valid email address.", "error");
            emailInput.focus();
            return;
        }

        if (!password) {
            showMessage("Please create a password.", "error");
            passwordInput.focus();
            return;
        }

        if (password.length < 8) {
            showMessage("Password must be at least 8 characters.", "error");
            passwordInput.focus();
            return;
        }

        setLoadingState(true);

        try {
            const response = await fetch(
    "https://https://liftlog-otf6.onrender.com/api/auth/login",
                {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        name,
                        email,
                        password
                    })
                }
            );

            let result;
            const contentType = response.headers.get("content-type") || "";

            if (contentType.includes("application/json")) {
                result = await response.json();
            } else {
                const text = await response.text();
                result = {
                    success: false,
                    error: text || "The server returned an invalid response."
                };
            }

            console.log("Registration response:", result);

            if (!response.ok || result.success === false) {
                console.error("Registration failed:", result);

                let message =
                    result.error ||
                    result.message ||
                    "Registration failed. Please try again.";

                const normalized = String(message).toLowerCase();

                if (normalized.includes("row-level security")) {
                    message =
                        "Account creation was blocked by the database security policy. Check your Supabase secret key and users table RLS.";
                }

                if (normalized.includes("already been registered")) {
                    message = "An account with this email already exists.";
                }

                showMessage(message, "error");
                return;
            }

            showMessage(
                "Account created successfully! Redirecting to login...",
                "success"
            );

            registerForm.reset();

            setTimeout(function () {
                window.location.href = "login.html";
            }, 1200);
        } catch (error) {
            console.error("Registration request error:", error);
            showMessage(
                "Unable to connect to the LiftLog server. Make sure the backend is running on port 5000.",
                "error"
            );
        } finally {
            setLoadingState(false);
        }
    });
});
</script>


</body>

</html>
