<script>
document.addEventListener("DOMContentLoaded", function () {

    // =====================================================
    // LIFTLOG API
    // =====================================================

    const API_URL = "https://liftlog-otf6.onrender.com";


    // =====================================================
    // ELEMENTS
    // =====================================================

    const loginForm = document.getElementById("loginForm");
    const loginButton = document.getElementById("loginButton");
    const loginMessage = document.getElementById("loginMessage");

    const emailInput = document.getElementById("email");
    const passwordInput = document.getElementById("password");

    const passwordToggle =
        document.querySelector(".password-toggle");


    // =====================================================
    // CHECK ELEMENTS
    // =====================================================

    if (!loginForm) {
        console.error("Login form was not found.");
        return;
    }

    if (!emailInput) {
        console.error("Email input was not found.");
        return;
    }

    if (!passwordInput) {
        console.error("Password input was not found.");
        return;
    }


    // =====================================================
    // PASSWORD SHOW / HIDE
    // =====================================================

    if (passwordToggle) {

        passwordToggle.addEventListener(
            "click",
            function () {

                const isPassword =
                    passwordInput.type === "password";


                passwordInput.type =
                    isPassword
                        ? "text"
                        : "password";


                passwordToggle.setAttribute(
                    "aria-label",
                    isPassword
                        ? "Hide password"
                        : "Show password"
                );


                passwordToggle.setAttribute(
                    "aria-pressed",
                    isPassword
                        ? "true"
                        : "false"
                );


                const icon =
                    passwordToggle.querySelector("i");


                if (icon) {

                    icon.classList.toggle(
                        "fa-eye",
                        !isPassword
                    );

                    icon.classList.toggle(
                        "fa-eye-slash",
                        isPassword
                    );

                }

            }
        );

    }


    // =====================================================
    // SHOW MESSAGE
    // =====================================================

    function showMessage(message, type = "") {

        if (!loginMessage) {
            console.log(message);
            return;
        }


        loginMessage.textContent = message;

        loginMessage.className = "auth-message";


        if (type) {
            loginMessage.classList.add(type);
        }

    }


    // =====================================================
    // LOADING STATE
    // =====================================================

    function setLoadingState(loading) {

        if (!loginButton) {
            return;
        }


        loginButton.disabled = loading;


        loginButton.textContent =
            loading
                ? "Signing in..."
                : "Sign In";

    }


    // =====================================================
    // LOGIN FORM
    // =====================================================

    loginForm.addEventListener(
        "submit",
        async function (event) {

            event.preventDefault();


            // =================================================
            // GET VALUES
            // =================================================

            const email =
                emailInput.value
                    .trim()
                    .toLowerCase();


            const password =
                passwordInput.value;


            // Clear previous message

            showMessage("");


            // =================================================
            // VALIDATE EMAIL
            // =================================================

            if (!email) {

                showMessage(
                    "Please enter your email.",
                    "error"
                );

                emailInput.focus();

                return;
            }


            if (!emailInput.checkValidity()) {

                showMessage(
                    "Please enter a valid email address.",
                    "error"
                );

                emailInput.focus();

                return;
            }


            // =================================================
            // VALIDATE PASSWORD
            // =================================================

            if (!password) {

                showMessage(
                    "Please enter your password.",
                    "error"
                );

                passwordInput.focus();

                return;
            }


            if (password.length < 8) {

                showMessage(
                    "Password must be at least 8 characters.",
                    "error"
                );

                passwordInput.focus();

                return;
            }


            // =================================================
            // START LOADING
            // =================================================

            setLoadingState(true);


            try {

                console.log(
                    "Attempting login..."
                );

                console.log(
                    "Login API:",
                    `${API_URL}/api/auth/login`
                );


                // =================================================
                // SEND LOGIN REQUEST
                // =================================================

                const response =
                    await fetch(
                        `${API_URL}/api/auth/login`,
                        {
                            method: "POST",

                            headers: {
                                "Content-Type":
                                    "application/json"
                            },

                            body: JSON.stringify({
                                email: email,
                                password: password
                            })
                        }
                    );


                console.log(
                    "Login HTTP status:",
                    response.status
                );


                // =================================================
                // READ RESPONSE
                // =================================================

                const contentType =
                    response.headers.get(
                        "content-type"
                    ) || "";


                let result;


                if (
                    contentType.includes(
                        "application/json"
                    )
                ) {

                    result =
                        await response.json();

                } else {

                    const text =
                        await response.text();


                    result = {
                        success: false,
                        error:
                            text ||
                            "The server returned an invalid response."
                    };

                }


                console.log(
                    "Login response:",
                    result
                );


                // =================================================
                // LOGIN FAILED
                // =================================================

                if (
                    !response.ok ||
                    result.success === false
                ) {

                    const errorMessage =
                        result.error ||
                        result.message ||
                        "Invalid email or password.";


                    console.error(
                        "Login failed:",
                        errorMessage
                    );


                    showMessage(
                        errorMessage,
                        "error"
                    );


                    return;
                }


                // =================================================
                // LOGIN SUCCESSFUL
                // =================================================

                console.log(
                    "Login successful."
                );


                // =================================================
                // GET TOKEN
                // =================================================

                const token =
                    result.token ||
                    result.access_token ||
                    result.session?.access_token;


                console.log(
                    "Token returned:",
                    !!token
                );


                // =================================================
                // NO TOKEN
                // =================================================

                if (!token) {

                    console.error(
                        "The backend returned a successful response but no token.",
                        result
                    );


                    showMessage(
                        "Login succeeded, but the server did not return an authentication token.",
                        "error"
                    );


                    return;
                }


                // =================================================
                // SAVE TOKEN
                // =================================================

                localStorage.setItem(
                    "liftlog_token",
                    token
                );


                // Also save under common names
                // so existing LiftLog pages can find it.

                localStorage.setItem(
                    "token",
                    token
                );


                localStorage.setItem(
                    "access_token",
                    token
                );


                console.log(
                    "Authentication token saved."
                );


                // =================================================
                // SAVE USER
                // =================================================

                if (result.user) {

                    localStorage.setItem(
                        "liftlog_user",
                        JSON.stringify(
                            result.user
                        )
                    );


                    localStorage.setItem(
                        "user",
                        JSON.stringify(
                            result.user
                        )
                    );


                    console.log(
                        "User information saved."
                    );

                }


                // =================================================
                // SAVE SESSION IF RETURNED
                // =================================================

                if (result.session) {

                    localStorage.setItem(
                        "liftlog_session",
                        JSON.stringify(
                            result.session
                        )
                    );


                    console.log(
                        "Session information saved."
                    );

                }


                // =================================================
                // SUCCESS MESSAGE
                // =================================================

                showMessage(
                    "Login successful! Welcome back.",
                    "success"
                );


                // =================================================
                // REDIRECT
                // =================================================

                console.log(
                    "Redirecting to home.html..."
                );


                setTimeout(
                    function () {

                        window.location.href =
                            "home.html";

                    },
                    700
                );

            } catch (error) {

                // =================================================
                // NETWORK ERROR
                // =================================================

                console.error(
                    "LOGIN REQUEST ERROR:",
                    error
                );


                showMessage(
                    "Unable to connect to the LiftLog server. Please check your internet connection and try again.",
                    "error"
                );

            } finally {

                // =================================================
                // STOP LOADING
                // =================================================

                setLoadingState(false);

            }

        }
    );

});
</script>
