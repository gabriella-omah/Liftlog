<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="Log in to your LiftLog account and track your workouts."
    >

    <title>Log In • LiftLog</title>


    <!-- Bootstrap -->

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >


    <!-- Bootstrap Icons -->

    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    >


    <!-- Google Fonts -->

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Poppins:wght@500;600;700&display=swap"
        rel="stylesheet"
    >


    <!-- Font Awesome -->

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    >


    <!-- Global CSS -->

    <link
        rel="stylesheet"
        href="style/style.css"
    >


    <!-- Auth CSS -->

    <link
        rel="stylesheet"
        href="style/login.css"
    >

</head>


<body>


<main class="auth-page">


    <div id="navbar-placeholder"></div>


    <section class="auth-card">


        <!-- HEADER -->

        <div class="auth-header">

            <h1>Welcome back</h1>

            <p>
                Log in to continue tracking your workouts and progress.
            </p>

        </div>


        <!-- LOGIN FORM -->

        <form
            id="loginForm"
            class="auth-form"
            novalidate
        >


            <!-- EMAIL -->

            <div class="form-group">

                <label for="email">
                    Email
                </label>


                <div class="input-wrapper">

                    <i
                        class="fa-regular fa-envelope input-icon"
                        aria-hidden="true"
                    ></i>


                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="you@example.com"
                        autocomplete="email"
                        required
                    >

                </div>

            </div>


            <!-- PASSWORD -->

            <div class="form-group">

                <label for="password">
                    Password
                </label>


                <div class="input-wrapper password-wrapper">

                    <i
                        class="fa-solid fa-lock input-icon"
                        aria-hidden="true"
                    ></i>


                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Your password"
                        autocomplete="current-password"
                        minlength="8"
                        required
                    >


                    <button
                        type="button"
                        class="password-toggle"
                        aria-label="Show password"
                        aria-pressed="false"
                    >

                        <i
                            class="fa-regular fa-eye"
                            aria-hidden="true"
                        ></i>

                    </button>

                </div>

            </div>


            <!-- SUBMIT -->

            <button
                type="submit"
                id="loginButton"
                class="auth-submit"
            >
                Log In
            </button>


            <!-- MESSAGE -->

            <p
                id="loginMessage"
                class="auth-message"
                role="alert"
                aria-live="polite"
            ></p>


        </form>


        <!-- REGISTER LINK -->

        <div class="auth-links">

            <p>
                Don't have an account?
                <a href="register.html">
                    Create one
                </a>
            </p>

        </div>


    </section>


</main>


<script src="javascript/data.js"></script>


<script>

document.addEventListener("DOMContentLoaded", function () {


    // =====================================================
    // API
    // =====================================================

    const API_URL =
        "https://liftlog-otf6.onrender.com";


    // =====================================================
    // ELEMENTS
    // =====================================================

    const loginForm =
        document.getElementById("loginForm");

    const loginButton =
        document.getElementById("loginButton");

    const loginMessage =
        document.getElementById("loginMessage");

    const emailInput =
        document.getElementById("email");

    const passwordInput =
        document.getElementById("password");

    const passwordToggle =
        document.querySelector(".password-toggle");


    // =====================================================
    // PASSWORD TOGGLE
    // =====================================================

    if (
        passwordInput &&
        passwordToggle
    ) {

        passwordToggle.addEventListener(
            "click",
            function () {

                const showingPassword =
                    passwordInput.type === "text";


                passwordInput.type =
                    showingPassword
                        ? "password"
                        : "text";


                passwordToggle.setAttribute(
                    "aria-label",
                    showingPassword
                        ? "Show password"
                        : "Hide password"
                );


                passwordToggle.setAttribute(
                    "aria-pressed",
                    showingPassword
                        ? "false"
                        : "true"
                );


                const icon =
                    passwordToggle.querySelector("i");


                if (icon) {

                    icon.classList.toggle(
                        "fa-eye",
                        showingPassword
                    );

                    icon.classList.toggle(
                        "fa-eye-slash",
                        !showingPassword
                    );

                }

            }
        );

    }


    // =====================================================
    // MESSAGE
    // =====================================================

    function showMessage(
        message,
        type = ""
    ) {

        loginMessage.textContent =
            message;

        loginMessage.className =
            "auth-message";


        if (type) {

            loginMessage.classList.add(
                type
            );

        }

    }


    // =====================================================
    // LOADING
    // =====================================================

    function setLoadingState(
        loading
    ) {

        loginButton.disabled =
            loading;


        loginButton.textContent =
            loading
                ? "Logging in..."
                : "Log In";

    }


    // =====================================================
    // LOGIN
    // =====================================================

    loginForm.addEventListener(
        "submit",
        async function (event) {

            event.preventDefault();


            const email =
                emailInput.value
                    .trim()
                    .toLowerCase();


            const password =
                passwordInput.value;


            showMessage("");


            // =================================================
            // VALIDATION
            // =================================================

            if (!email) {

                showMessage(
                    "Please enter your email.",
                    "error"
                );

                emailInput.focus();

                return;
            }


            if (!emailInput.checkValidity()) {

                showMessage(
                    "Please enter a valid email address.",
                    "error"
                );

                emailInput.focus();

                return;
            }


            if (!password) {

                showMessage(
                    "Please enter your password.",
                    "error"
                );

                passwordInput.focus();

                return;
            }


            if (password.length < 8) {

                showMessage(
                    "Password must be at least 8 characters.",
                    "error"
                );

                passwordInput.focus();

                return;
            }


            setLoadingState(true);


            // =================================================
            // REQUEST
            // =================================================

            try {

                const response =
                    await fetch(
                        `${API_URL}/api/auth/login`,
                        {
                            method: "POST",

                            headers: {
                                "Content-Type":
                                    "application/json"
                            },

                            body: JSON.stringify({
                                email,
                                password
                            })
                        }
                    );


                const contentType =
                    response.headers.get(
                        "content-type"
                    ) || "";


                let result;


                if (
                    contentType.includes(
                        "application/json"
                    )
                ) {

                    result =
                        await response.json();

                } else {

                    const text =
                        await response.text();


                    result = {
                        success: false,
                        error:
                            text ||
                            "The server returned an invalid response."
                    };

                }


                console.log(
                    "Login response:",
                    result
                );


                // =================================================
                // ERROR
                // =================================================

                if (
                    !response.ok ||
                    result.success === false
                ) {

                    const message =
                        result.error ||
                        result.message ||
                        "Invalid email or password.";


                    showMessage(
                        message,
                        "error"
                    );

                    return;
                }


                // =================================================
                // SAVE TOKEN
                // =================================================

                const token =
                    result.token ||
                    result.access_token ||
                    result.session?.access_token;


                if (!token) {

                    console.error(
                        "Login succeeded but no authentication token was returned.",
                        result
                    );


                    showMessage(
                        "Login succeeded, but the server did not return an authentication token.",
                        "error"
                    );

                    return;
                }


                localStorage.setItem(
                    "liftlog_token",
                    token
                );


                // Optional user information

                if (result.user) {

                    localStorage.setItem(
                        "liftlog_user",
                        JSON.stringify(
                            result.user
                        )
                    );

                }


                // =================================================
                // SUCCESS
                // =================================================

                showMessage(
                    "Login successful! Redirecting...",
                    "success"
                );


                setTimeout(function () {

                    window.location.href =
                        "index.html";

                }, 800);


            } catch (error) {

                console.error(
                    "Login request error:",
                    error
                );


                showMessage(
                    "Unable to connect to the LiftLog server. Please try again.",
                    "error"
                );

            } finally {

                setLoadingState(false);

            }

        }
    );

});

</script>


</body>

</html>
