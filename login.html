<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>
<title>LiftLog — Log In</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >


    <!-- =====================================================
         BOOTSTRAP ICONS
    ====================================================== -->
    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    >


    <!-- =====================================================
         GOOGLE FONTS
    ====================================================== -->
    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Poppins:wght@500;600;700&display=swap"
        rel="stylesheet"
    >


    <!-- =====================================================
         FONT AWESOME
    ====================================================== -->
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    >


<link
    rel="stylesheet"
    href="style/style.css"
>
<link
    rel="stylesheet"
    href="style/login.css"
>

</head>
<body>
<main class="auth-page">

    <div id="navbar-placeholder"></div>

    <section class="auth-card">

        <!-- Header -->
        <div class="auth-header">

            <h1>Welcome back</h1>

            <p>
                Log in to continue tracking your workouts and progress.
            </p>

        </div>

        <!-- Login form -->
        <form id="loginForm" class="auth-form" novalidate>

            <div class="form-group">

                <label for="email">Email</label>

                <div class="input-wrapper">
                    <i class="fa-regular fa-envelope input-icon" aria-hidden="true"></i>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="you@example.com"
                        autocomplete="email"
                        required
                    >
                </div>

            </div>

            <div class="form-group">

                <label for="password">Password</label>

                <div class="input-wrapper password-wrapper">
                    <i class="fa-solid fa-lock input-icon" aria-hidden="true"></i>
                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter your password"
                        autocomplete="current-password"
                        required
                    >
                    <button
                        type="button"
                        class="password-toggle"
                        aria-label="Show password"
                        aria-pressed="false"
                    >
                        <i class="fa-regular fa-eye" aria-hidden="true"></i>
                    </button>
                </div>

            </div>

            <button
                type="submit"
                id="loginButton"
                class="auth-submit"
            >
                Log In
            </button>

            <p
                id="loginMessage"
                class="auth-message"
                role="alert"
                aria-live="polite"
            ></p>

        </form>

        <!-- Register link -->
        <div class="auth-links">
            <p>
                Don’t have an account?
                <a href="register.html">Create one</a>
            </p>
        </div>

    </section>

</main>
<script src="javascript/data.js"></script>
<script>
/* =========================================================
   ELEMENTS
========================================================= */
const loginForm =
    document.getElementById("loginForm");
const loginButton =
    document.getElementById("loginButton");
const loginMessage =
    document.getElementById("loginMessage");
        const nameInput = document.getElementById("name");
    const emailInput = document.getElementById("email");
    const passwordInput = document.getElementById("password");
    const passwordToggle = document.querySelector(".password-toggle");
        // ======================================================
    // PASSWORD TOGGLE
    // ======================================================

    if (passwordInput && passwordToggle) {
        passwordToggle.addEventListener("click", function () {
            const showingPassword = passwordInput.type === "text";

            passwordInput.type = showingPassword ? "password" : "text";

            passwordToggle.setAttribute(
                "aria-label",
                showingPassword ? "Show password" : "Hide password"
            );

            passwordToggle.setAttribute(
                "aria-pressed",
                showingPassword ? "false" : "true"
            );

            const icon = passwordToggle.querySelector("i");
            if (icon) {
                icon.classList.toggle("fa-eye", showingPassword);
                icon.classList.toggle("fa-eye-slash", !showingPassword);
            }
        });
    }

/* =========================================================
   LOGIN
========================================================= */
loginForm.addEventListener(
    "submit",
    async (event) => {
        event.preventDefault();
        /* -------------------------------------------------
           Get form values
        ------------------------------------------------- */
        const email =
            document
                .getElementById("email")
                .value
                .trim();
        const password =
            document
                .getElementById("password")
                .value;
        /* -------------------------------------------------
           Clear previous message
        ------------------------------------------------- */
        loginMessage.textContent = "";
        loginMessage.className = "";
        /* -------------------------------------------------
           Basic validation
        ------------------------------------------------- */
        if (!email || !password) {
            loginMessage.textContent =
                "Please enter your email and password.";
            return;
        }
        try {
            /* ---------------------------------------------
               Disable button
            --------------------------------------------- */
            loginButton.disabled = true;
            loginButton.textContent =
                "Logging In...";
            /* ---------------------------------------------
               Send login request to backend
            --------------------------------------------- */
            const response =
                await fetch(
                    "http://localhost:5000/api/auth/login",
                    {
                        method: "POST",
                        headers: {
                            "Content-Type":
                                "application/json"
                        },
                        body: JSON.stringify({
                            email,
                            password
                        })
                    }
                );
            /* ---------------------------------------------
               Read backend response
            --------------------------------------------- */
            let result;
            try {
                result =
                    await response.json();
            } catch {
                result = {
                    error:
                        "The server returned an invalid response."
                };
            }
            /* ---------------------------------------------
               Handle login error
            --------------------------------------------- */
            if (!response.ok) {
                console.error(
                    "Login failed:",
                    result
                );
                loginMessage.textContent =
                    result.error ||
                    "Login failed.";
                return;
            }
            /* ---------------------------------------------
               Login successful
            --------------------------------------------- */
            console.log(
                "Login successful:",
                result
            );
            /* ---------------------------------------------
               Save authentication session
            --------------------------------------------- */
            if (result.session) {
                localStorage.setItem(
                    "liftlogSession",
                    JSON.stringify(result.session)
                );
            }
            /* ---------------------------------------------
               Save basic user information
            --------------------------------------------- */
            if (result.user) {
                localStorage.setItem(
                    "liftlogUser",
                    JSON.stringify({
                        id: result.user.id,
                        email: result.user.email,
                        name:
                            result.user.user_metadata?.name ||
                            ""
                    })
                );
            }
            /* ---------------------------------------------
               Success message
            --------------------------------------------- */
            loginMessage.textContent =
                "Login successful!";
            loginMessage.className =
                "success";
            /* ---------------------------------------------
               Go to dashboard
            --------------------------------------------- */
            setTimeout(() => {
                window.location.replace("home.html");
            }, 800);
        } catch (error) {
            console.error(
                "Login request error:",
                error
            );
            loginMessage.textContent =
                "Unable to connect to the LiftLog server. Make sure the backend is running.";
        } finally {
            loginButton.disabled = false;
            loginButton.textContent =
                "Log In";
        }
    }
);
</script>
</body>
</html>
